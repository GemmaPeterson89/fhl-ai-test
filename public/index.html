<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2742" />
    <title>FH&amp;L AI Assistant | Florida Homes &amp; Loans</title>
    <meta
      name="description"
      content="Chat with the Florida Homes & Loans AI assistant about buying, selling, mortgage financing, investing and relocating to Florida's Space Coast and Central Florida."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0f2742;
        --blue: #1b5e9e;
        --text: #374151;
        --muted: #6b7280;
        --line: #e6e8ee;
        --soft: #f7f8fb;
        --white: #ffffff;
        --radius: 16px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--soft);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 760px;
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        padding-top: max(14px, env(safe-area-inset-top));
        background: var(--navy);
        color: #fff;
      }

      .logo {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--blue);
        font-family: "Fraunces", Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .brand {
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.2;
      }

      .brand p {
        margin: 2px 0 0;
        font-size: 12px;
        color: #c3d0dc;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }

      .welcome {
        padding: 4px 0 8px;
      }

      .welcome h2 {
        margin: 0 0 6px;
        font-family: "Fraunces", Georgia, serif;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
        color: var(--navy);
        text-wrap: balance;
      }

      .welcome p {
        margin: 0 0 16px;
        font-size: 14px;
        color: var(--muted);
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .suggestion {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--navy);
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s, background-color 0.15s;
      }

      .suggestion:hover {
        border-color: var(--blue);
        background: #eef4fb;
      }

      .message {
        max-width: 88%;
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 15px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message.user {
        align-self: flex-end;
        background: var(--navy);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .message.assistant {
        align-self: flex-start;
        background: var(--white);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }

      .message.error {
        align-self: flex-start;
        background: #fdf0ee;
        border: 1px solid #f0c9c2;
        color: #8a2c1d;
        font-size: 14px;
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        padding: 4px 0;
      }

      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        opacity: 0.4;
        animation: blink 1.2s infinite ease-in-out;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .typing span {
          animation: none;
        }
        .messages {
          scroll-behavior: auto;
        }
      }

      .composer-wrap {
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        background: var(--soft);
        border-top: 1px solid var(--line);
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 6px 6px 6px 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .composer:focus-within {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(27, 94, 158, 0.15);
      }

      .composer textarea {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        font: inherit;
        font-size: 16px;
        color: var(--text);
        padding: 8px 0;
        max-height: 140px;
        line-height: 1.4;
      }

      .composer textarea::placeholder {
        color: #9ca3af;
      }

      .send {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
        transition: background-color 0.15s, opacity 0.15s;
      }

      .send:hover:not(:disabled) {
        background: #164d82;
      }

      .send:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .send:focus-visible,
      .suggestion:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      .disclaimer {
        margin: 8px 2px 0;
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
        text-align: center;
      }

      @media (min-width: 640px) {
        .site-header {
          padding: 18px 24px;
        }
        .messages {
          padding: 28px 24px;
        }
        .composer-wrap {
          padding: 14px 24px 18px;
        }
        .welcome h2 {
          font-size: 30px;
        }
        .message {
          max-width: 78%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <div class="logo" aria-hidden="true">FH&amp;L</div>
        <div class="brand">
          <h1>FH&amp;L AI Assistant</h1>
          <p>Florida Homes &amp; Loans &middot; FHL Mortgages</p>
        </div>
      </header>

      <main
        id="messages"
        class="messages"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Conversation"
      >
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
  <h2 id="welcome-title">Buy, Sell or Finance with FHL.</h2>
  <p>How can we help?</p>
  <ul class="suggestions" aria-label="Suggested questions">
 <li><button type="button" class="suggestion">Help me find a home</button></li>
 <li><button type="button" class="suggestion">What&apos;s my home worth?</button></li>
 <li><button type="button" class="suggestion">What&apos;s the difference between conventional and FHA mortgages?</button></li>
 <li><button type="button" class="suggestion">What&apos;s a rate buy down?</button></li>
          </ul>
        </section>
      </main>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <label for="input" class="sr-only">Message the FH&amp;L assistant</label>
          <textarea
            id="input"
            rows="1"
            maxlength="2000"
            placeholder="Ask a question..."
            autocomplete="off"
          ></textarea>
          <button type="submit" class="send" id="send" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </form>
        <p class="disclaimer">
          AI responses are informational only and not a commitment to lend. Please don&apos;t share
          sensitive personal or financial information.
        </p>
      </div>
    </div>

    <script>
      (() => {
        const messagesEl = document.getElementById("messages");
        const welcomeEl = document.getElementById("welcome");
        const form = document.getElementById("composer");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const history = [];
        let pending = false;

        const updateSendState = () => {
          sendBtn.disabled = pending || input.value.trim().length === 0;
        };

        const autoResize = () => {
          input.style.height = "auto";
          input.style.height = Math.min(input.scrollHeight, 140) + "px";
        };

        const scrollToBottom = () => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        const addMessage = (role, text) => {
          const el = document.createElement("div");
          el.className = "message " + role;
          el.textContent = text;
          messagesEl.appendChild(el);
          scrollToBottom();
          return el;
        };

        const addTyping = () => {
          const el = document.createElement("div");
          el.className = "message assistant";
          el.setAttribute("aria-label", "Assistant is typing");
          el.innerHTML = '<span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>';
          messagesEl.appendChild(el);
          scrollToBottom();
          return el;
        };

        const send = async (text) => {
          const message = text.trim();
          if (!message || pending) return;

          pending = true;
          welcomeEl.hidden = true;
          input.value = "";
          autoResize();
          updateSendState();

          addMessage("user", message);
          const typingEl = addTyping();

          try {
            const res = await fetch("/api/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message, history }),
            });
            const data = await res.json().catch(() => ({}));
            typingEl.remove();

            if (!res.ok || !data.reply) {
              throw new Error(data.error || "The FH&L assistant could not respond.");
            }

            addMessage("assistant", data.reply);
            history.push({ role: "user", content: message }, { role: "assistant", content: data.reply });
          } catch (err) {
            typingEl.remove();
            addMessage("error", (err && err.message) || "Something went wrong. Please try again.");
          } finally {
            pending = false;
            updateSendState();
            input.focus();
          }
        };

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          send(input.value);
        });

        input.addEventListener("input", () => {
          autoResize();
          updateSendState();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || e.shiftKey) return;
          if (e.isComposing || e.keyCode === 229) return;
          e.preventDefault();
          send(input.value);
        });

        document.querySelectorAll(".suggestion").forEach((btn) => {
          btn.addEventListener("click", () => send(btn.textContent));
        });
      })();
    </script>
  </body>
</html>
